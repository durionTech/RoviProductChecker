{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body p-4">

                <h3>
                    New Product Inspection
                </h3>

                <p class="text-muted">

                    Upload product package images.
                    Front image is required.

                </p>


                <form
                    method="POST"
                    enctype="multipart/form-data"
                >

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Product Name
                        </label>

                        <input
                            type="text"
                            name="product_name"
                            class="form-control"
                            placeholder="Example: Britannia Good Day"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">

                            Front Image *

                        </label>

                        <input
                            type="file"
                            name="front_image"
                            class="form-control"
                            accept="image/*"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">

                            Back Image

                        </label>

                        <input
                            type="file"
                            name="back_image"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">

                            Side Image

                        </label>

                        <input
                            type="file"
                            name="side_image"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >

                        Upload & Start Inspection

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
